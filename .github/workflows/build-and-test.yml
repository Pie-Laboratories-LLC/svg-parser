name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            native-lib: libsvgparser_c.so
          - os: windows-latest
            rid: win-x64
            native-lib: svgparser_c.dll
          - os: macos-latest
            rid: osx-arm64
            native-lib: libsvgparser_c.dylib

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libxerces-c-dev libfreetype-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 xerces-c freetype llvm
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "CC=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$(brew --prefix llvm)/bin/clang++" >> "$GITHUB_ENV"

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        run: |
          git clone https://github.com/microsoft/vcpkg
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg install openssl xerces-c freetype --triplet x64-windows

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSVGPARSER_WITH_CSHARP_BINDINGS=ON -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake
      
      - name: Configure CMake (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSVGPARSER_WITH_CSHARP_BINDINGS=ON

      - name: Build
        run: cmake --build build --config Release -j

      - name: Run C++ tests
        run: ctest --test-dir build --output-on-failure

      - name: Upload native library artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: build/bindings/csharp/native/${{ matrix.native-lib }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build managed test project
        run: dotnet build bindings/csharp/managed/SvgParser.Tests

      - name: Run C# tests
        run: dotnet test bindings/csharp/managed/SvgParser.Tests --no-build

  pack:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          path: native-artifacts

      - name: Build managed library
        run: dotnet build bindings/csharp/managed/SvgParser -c Release

      - name: Assemble native binaries for packing
        run: |
          mkdir -p build/bindings/csharp/native
          cp native-artifacts/native-linux-x64/libsvgparser_c.so build/bindings/csharp/native/
          cp native-artifacts/native-win-x64/svgparser_c.dll build/bindings/csharp/native/
          cp native-artifacts/native-osx-arm64/libsvgparser_c.dylib build/bindings/csharp/native/libsvgparser_c-arm64.dylib

      - name: Pack NuGet package
        run: nuget pack bindings/csharp/managed/SvgParser/SvgParser.nuspec -Version 1.1.0 -Properties Configuration=Release

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: '*.nupkg'
